name: Turn tag into release

on:
  push:
    tags:
      - '*.*.*'
  # Allow manually triggering the workflow.
  workflow_dispatch:

# Cancels all previous workflow runs for the same branch that have not yet completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions should be configured at the job level.
permissions: {}

jobs:
  bundle:
    permissions:
      contents: read # To clone the repo.

    name: Bundle PHAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.0
          extensions: exif, phar, openssl
          coverage: none
          ini-values: phar.readonly=Off, error_reporting=-1, display_errors=On, display_startup_errors=On, zend.assertions=1
        env:
          fail-fast: true

      - name: Install Box
        run: composer global require humbug/box

      - name: Validate configuration
        run: box validate -i box.json

      - name: Build PHAR
        run: box compile -v --config=box.json

      - name: Display PHAR info via Box
        run: box info -l patchwork.phar

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phar
          path: ./patchwork.phar

  publish:
    permissions:
      contents: write # To draft the release.

    needs:
      - bundle

    name: Add PHAR to release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phar

      - name: Draft release
        id: upload-release-asset
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: patchwork.phar
          draft: true
          name: Version %{{ github.ref }}
          generate_release_notes: true

  regenerate-pages:
    permissions:
      contents: write # To clone the repo and commit the changes.

    needs:
      - publish

    name: Trigger update of GitHub Pages branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GH Pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          persist-credentials: false
          
      - name: Configure Git credentials
        run: |
          git config --global user.name antecedent
          git config --global user.email ignas.rudaitis@gmail.com
      
      - name: Commit and push
        run: |
          git commit --allow-empty -m "Deploy version ${{ github.ref }}"
          git push origin gh-pages
